<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pathian Ram - Tithe Collection Web Application</title>
    <script>
      // Anti-Clickjacking & Anti-Phishing Frame Buster
      try {
        if (window.top !== window.self) {
          window.top.location = window.self.location;
        }
      } catch (e) {
        // If access to window.top is blocked by sandbox, blank out the body
        document.documentElement.style.display = 'none';
      }
      // Instant Persistent Font Size Application
      try {
        const sz = localStorage.getItem('pathian_ram_font_size') || 'normal';
        const scales = { small: '90%', normal: '100%', large: '112.5%', xlarge: '125%' };
        if (scales[sz]) {
          document.documentElement.style.fontSize = scales[sz];
          document.documentElement.style.setProperty('--app-font-scale', scales[sz]);
          document.documentElement.setAttribute('data-font-size', sz);
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
